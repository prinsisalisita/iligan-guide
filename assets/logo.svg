<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Iligan Explorer</title>
  <desc id="d">The letter I formed by a waterfall: a rock ledge on top, falling water as the stem, and a pool with mist at the base.</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0b7a6b"/>
    </linearGradient>
  </defs>
  <!-- top ledge (serif) -->
  <rect x="64" y="38" width="128" height="26" rx="13" fill="#155e75"/>
  <!-- falling water (stem), fanning out at the bottom -->
  <path d="M108 60 H148 C148 110 156 152 162 200 H94 C100 152 108 110 108 60 Z" fill="url(#water)"/>
  <!-- flow streaks -->
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".6">
    <path d="M118 72 C118 112 114 152 108 188"/>
    <path d="M128 72 V188" stroke-dasharray="40 14"/>
    <path d="M138 72 C138 112 142 152 148 188"/>
  </g>
  <!-- mist -->
  <g fill="#fff" opacity=".85">
    <circle cx="106" cy="198" r="8"/>
    <circle cx="128" cy="194" r="11"/>
    <circle cx="150" cy="198" r="8"/>
  </g>
  <!-- pool (base serif) with ripples -->
  <rect x="64" y="198" width="128" height="26" rx="13" fill="#155e75"/>
  <path d="M84 211 Q96 204 108 211 T132 211 T156 211 T172 211" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55"/>
</svg>
